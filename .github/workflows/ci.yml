name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: llm_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Type check with mypy
        run: |
          mypy src --ignore-missing-imports --no-error-summary 2>&1 | head -20 || true
      
      - name: Lint with ruff
        run: |
          ruff check src tests || true
      
      - name: Format check with black
        run: |
          black --check src tests || true
      
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/llm_test
          REDIS_URL: redis://localhost:6379
          ENABLE_CACHING: "true"
          ENABLE_ML_ROUTING: "false"
          ENABLE_RAG_ROUTING: "false"
          APP_ENV: test
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html -x 2>&1 | head -50
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: llm-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Security scan with bandit
        run: |
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src || true

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify imports
        run: |
          python -c "from src.main import app; print('✓ App imports successfully')"
          python -c "from src.services.router import router; print('✓ Router imports successfully')"
          python -c "from src.services.circuit_breaker import circuit_breaker_registry; print('✓ Circuit breaker imports successfully')"
          python -c "from src.utils.metrics import REGISTRY; print('✓ Metrics imports successfully')"
      
      - name: Check required files exist
        run: |
          test -f docker-compose.yml && echo "✓ docker-compose.yml exists" || exit 1
          test -f monitoring/prometheus.yml && echo "✓ prometheus.yml exists" || exit 1
          test -f monitoring/grafana/provisioning/datasources/prometheus.yml && echo "✓ Grafana datasource config exists" || exit 1
          test -f tests/load/locustfile.py && echo "✓ Locust test file exists" || exit 1
